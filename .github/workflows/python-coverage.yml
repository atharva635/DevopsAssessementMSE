name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1 pytest-cov==6.2.1 coverage==7.9

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Publish coverage comment on pull request
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 50
          MINIMUM_ORANGE: 40

      - name: Enforce minimum coverage threshold
        run: |
          coverage report --fail-under=50
